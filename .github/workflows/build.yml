name: Build and Release

on:
  push:
    branches:
      - build
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
            output_name: bibtool
          - target: windows
            os: windows-latest
            output_name: bibtool.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build on Linux
        if: matrix.target == 'linux'
        run: |
          chmod +x configure
          ./configure
          make

      - name: Setup MSYS2 MinGW
        if: matrix.target == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make

      - name: Expose MSYS2 tools to Bash
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build on Windows
        if: matrix.target == 'windows'
        shell: bash
        run: |
          mingw32-make -f makefile.unx clean || true
          mingw32-make -f makefile.unx
          if [ -f bibtool ] && [ ! -f bibtool.exe ]; then
            cp bibtool bibtool.exe
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bibtool-${{ matrix.target }}
          path: ${{ matrix.output_name }}
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set tag name
        run: echo "TAG_NAME=$(date -u +'%Y.%m.%d')" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release files
        run: |
          mkdir -p release
          cp dist/bibtool-linux/bibtool "release/bibtool-${TAG_NAME}-linux"
          zip -j "release/bibtool-${TAG_NAME}-windows.zip" dist/bibtool-windows/bibtool.exe

      - name: Update tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${TAG_NAME}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG_NAME}" --force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          files: |
            release/bibtool-${{ env.TAG_NAME }}-linux
            release/bibtool-${{ env.TAG_NAME }}-windows.zip
          generate_release_notes: true
